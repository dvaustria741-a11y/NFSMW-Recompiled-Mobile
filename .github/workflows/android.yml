name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'tools/android/**', 'tools/parche_*.py', 'app/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache prepared ReXGlue SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ../rexglue-sdk-android
          key: rexsdk-android-${{ hashFiles('tools/android/preparar_sdk.py', 'tools/parche_*.py') }}

      - name: Prepare SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: python tools/android/preparar_sdk.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
